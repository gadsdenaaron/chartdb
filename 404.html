<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>ChartDB</title>
        <!--
          GitHub Pages serves this file for any URL that doesn't match a
          real file (e.g. a deep link into the SPA like /chartdb/diagrams/abc).
          It re-encodes the path into a query string and redirects to the
          app's real index.html, which decodes it back (see the script in
          index.html) and hands the route to React Router.
          Technique: https://github.com/rafgraph/spa-github-pages
        -->
        <script type="text/javascript">
            // Must match the number of path segments in vite.config.ts's `base`
            // (base: '/chartdb/' -> 1 segment to keep).
            var pathSegmentsToKeep = 1;

            var l = window.location;
            l.replace(
                l.protocol +
                    '//' +
                    l.hostname +
                    (l.port ? ':' + l.port : '') +
                    l.pathname
                        .split('/')
                        .slice(0, 1 + pathSegmentsToKeep)
                        .join('/') +
                    '/?/' +
                    l.pathname
                        .slice(1)
                        .split('/')
                        .slice(pathSegmentsToKeep)
                        .join('/')
                        .replace(/&/g, '~and~') +
                    (l.search
                        ? '&' + l.search.slice(1).replace(/&/g, '~and~')
                        : '') +
                    l.hash
            );
        </script>
    </head>
    <body></body>
</html>
