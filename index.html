        <script type="text/javascript">
            // Decode the redirect that 404.html encodes for deep links on
            // GitHub Pages (e.g. /chartdb/diagrams/abc -> /chartdb/?/diagrams/abc),
            // turning it back into a normal URL before React Router mounts.
            // Runs first, before any other script on the page.
            // Technique: https://github.com/rafgraph/spa-github-pages
            (function (l) {
                if (l.search[1] === '/') {
                    var decoded = l.search
                        .slice(1)
                        .split('&')
                        .map(function (s) {
                            return s.replace(/~and~/g, '&');
                        })
                        .join('?');
                    window.history.replaceState(
                        null,
                        null,
                        l.pathname.slice(0, -1) + decoded + l.hash
                    );
                }
            })(window.location);
        </script>
